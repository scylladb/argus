server {
    # if you don't have a hostname, use a default_server directive.
    # !!! MAKE SURE THERE IS ONLY ONE default_server !!!
    # listen 80 default_server;
	listen 80;
	listen [::]:80;

    # Set to a list of hostnames this vhost will respond to,
    # space delimited, _ in case you don't have a hostname
	server_name _;

    location /s {
        alias "/home/argus/app/public";
        add_header Cache-Control "public, max-age=600";
        try_files $uri $uri/ =404;
    }

    # Forward everything to gunicorn
	location ~ ^(/(?!s/).*)$ {
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		# overwrite, never append: gunicorn trusts the socket peer
		# (forwarded_allow_ips="*"), so a client-supplied entry must not survive
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_redirect off;
		proxy_pass http://unix:/var/lib/argus/argus.sock;
	}

}
