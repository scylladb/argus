# Event Summarization — evaluation config.
#
# Everything here is configurable so the same harness prices and validates any model.
# The API key is NEVER in this file — it comes from the environment:
#     export ANTHROPIC_API_KEY=sk-ant-...
# (override the var name with `anthropic_api_key_env` below.)

# --- What to summarize -------------------------------------------------------
# Provide explicit run UUIDs, and/or a test UUID (its recent runs are auto-listed).
# Use runs that actually have ERROR/CRITICAL events with retained message bodies.
run_ids: []
#  - 24e09748-bba4-47fd-a615-bf7ea2c425eb
# test_id: 1eb20296-99ad-4857-97d0-c62e2e1754b3
test_run_limit: 20          # how many recent runs to scan when test_id is set
max_events: 25              # cap the unique-event set so a sweep stays cheap

# Collapse semantically-similar events the way production does (sanitize -> BGE embed ->
# cosine distance < threshold), instead of only exact-string dedup. Gives the true canonical
# set production would summarize. Needs the 'ai-eval' extra (chromadb); downloads the BGE model.
similarity_dedup: false
similarity_threshold: 0.05  # cosine distance; matches the worker (0.05 ≈ 95% similar)

# Skip events shorter than this many tokens, like the worker's EVENT_SUMMARIZATION_MIN_TOKENS.
# Set 0 to score every event.
min_event_tokens: 150

# Reuse a previously fetched set instead of hitting Argus again (from a --fetch-only run):
# events_file: argusAI/eval/out/events.json

# --- Models to compare -------------------------------------------------------
# `params` are passed straight through to the Messages API call, so each model gets the knobs
# it actually supports (thinking, output_config.effort, max_tokens, temperature, ...).
# Give two configs of one model distinct `label`s so they stay separate series.
models:
  - name: claude-haiku-4-5           # no extended thinking unless `thinking: {type: enabled, budget_tokens: N}`
  - name: claude-sonnet-5
    label: sonnet-5-low
    params: { output_config: { effort: low } }
  - name: claude-sonnet-5
    label: sonnet-5-no-thinking
    params: { thinking: { type: disabled } }

# --- Prompts to sweep (file stems from argusAI/prompts/vN_*.md) ---------------
# List several to A/B them on the same events; one is enough once a winner is picked.
# Add a new argusAI/prompts/vN_*.md file to introduce a new candidate.
prompts:
  - v3_compact        # production: labeled triage card, collapses backtrace and traceback glue
  - v1_surgical       # verbatim-leaning, high coverage
  - v2_summary        # readable summary-first, preserves SCT metadata

# --- Judge (frontier model scores each summary against the ORIGINAL) ----------
judge_enabled: true
judge_model: claude-opus-5  # neutral scorer: outside the candidate set, avoids self-preference
judge_params: { output_config: { effort: medium } }

# --- Provider / infra --------------------------------------------------------
anthropic_api_key_env: ANTHROPIC_API_KEY
# anthropic_base_url:         # set for a proxy or compatible endpoint
request_timeout: 90
max_concurrency: 4           # bounded, to respect rate limits
# argus_cli: /Users/you/bin/argus   # defaults to PATH, then ~/bin/argus
no_cache: false
output_dir: argusAI/eval/out

# --- Pricing (USD per 1M tokens) — override the placeholders with real numbers -
# Unknown models cost $0 and are flagged in the report.
# Claude first-party API rates per 1M tokens (2026-06). Cache reads bill at 10% of the input
# rate, cache writes at 125%. Override if your account differs.
pricing:
  claude-haiku-4-5: { input_per_1m: 1.00, output_per_1m: 5.00,  cached_per_1m: 0.10 }
  claude-sonnet-5:  { input_per_1m: 2.00, output_per_1m: 10.00, cached_per_1m: 0.20 }
  claude-opus-5:    { input_per_1m: 5.00, output_per_1m: 25.00, cached_per_1m: 0.50 }  # judge
