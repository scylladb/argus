[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qatools-health"
version = "0.1.0"
description = "Health checking for the ScyllaDB QA Tools services"
authors = [{ name = "Dusan Malusev", email = "dusan.malusev@scylladb.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["prometheus-client >= 0.21.0", "httpx >= 0.27.0"]

[project.urls]
Homepage = "https://github.com/scylladb/argus"
Repository = "https://github.com/scylladb/argus"

[project.optional-dependencies]
dev = [
  "pytest >= 8.3.5",
  "pytest-asyncio >= 0.24.0",
  "pytest-cov >= 6.1.1",
  "ruff >= 0.11.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
lint.preview = true
lint.explicit-preview-rules = true
lint.select = ["BLE", "F401", "F821", "F823", "F841", "PL", "PIE", "B006", "YTT", "F541"]
lint.ignore = ["E501", "PLR2004"]

[tool.ruff.lint.pylint]
max-args = 12
max-statements = 100
max-branches = 24
max-locals = 15

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
