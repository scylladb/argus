name: QA Tools Health

on:
  push:
    branches: [ master ]
    paths:
      - 'qatools-health/**'
      - '.github/workflows/qatools-health.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'qatools-health/**'
      - '.github/workflows/qatools-health.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: qatools-health

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e '.[dev]'

      - name: Check that the package stands alone
        run: |
          if grep -rn '^\s*\(import\|from\) argus' src tests examples; then
            echo 'qatools-health must not import argus'
            exit 1
          fi

      - name: Lint
        run: |
          .venv/bin/ruff check src tests examples
          .venv/bin/ruff format --check src tests examples

      - name: Test
        run: .venv/bin/pytest --cov=qatools_health --cov-fail-under=90
